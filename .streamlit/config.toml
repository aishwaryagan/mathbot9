### STEP 5 — Deploy on Streamlit (Make It a Live Website)

1. Go to **[share.streamlit.io](https://share.streamlit.io)**
2. Click **"Sign in with GitHub"** — authorize Streamlit when it asks
3. Click **"New app"**
4. Fill in the form:
```
Repository:     YOUR-USERNAME/mathbot9
Branch:         main
Main file path: app.py
```

5. Click **"Advanced settings"** and add your secret:
   - Click **"+ Add secret"** (or look for a "Secrets" text box)
   - Type this exactly:
```
ANTHROPIC_API_KEY = "sk-ant-..."
```

   - Replace `sk-ant-...` with your actual API key from [console.anthropic.com](https://console.anthropic.com)

6. Click **"Deploy!"**

Streamlit will take about **2–3 minutes** to install everything and boot up. You'll see a log scrolling — that's normal!

